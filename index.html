<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0f;
      color: #f0e8d0;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      width: 100%;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,15,0)   0%,
        rgba(10,10,15,0)   50%,
        rgba(10,10,15,0.6) 80%,
        rgba(10,10,15,1)   100%
      );
    }

    .hero-title {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
    }

    .hero-title h1 {
      font-size: clamp(1.3rem, 4.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f0e8d0;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }

    .gold-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 12px auto 0;
    }

    /* ── Section ── */
    .section {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 56px;
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      color: #c9a84c;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── App card ── */
    .app-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(135deg, #1a0f18, #0f1a2e);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .app-card:hover {
      transform: translateY(-3px);
      border-color: rgba(201,168,76,0.65);
    }

    .app-card-inner {
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 20px;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-info { flex: 1; min-width: 0; }

    .app-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .app-sub {
      font-size: 0.75rem;
      color: #c9a84c;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .app-desc {
      font-size: 0.8rem;
      color: rgba(240,232,208,0.6);
      line-height: 1.65;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    }

    .app-dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 20px 20px;
      padding: 13px 16px;
      background: linear-gradient(135deg, #8b1a2f, #6b2040);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 10px;
      color: #f0e8d0;
      font-size: 0.88rem;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.1em;
    }

    .app-dl-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
      margin: 36px 0;
    }

    /* ── Instagram ── */
    .insta-section { text-align: center; }

    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 50px;
      text-decoration: none;
      color: #f0e8d0;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      transition: border-color 0.2s, background 0.2s;
    }

    .insta-link:hover {
      border-color: rgba(201,168,76,0.7);
      background: rgba(201,168,76,0.06);
    }

    .insta-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .insta-note {
      margin-top: 10px;
      font-size: 0.72rem;
      color: rgba(240,232,208,0.35);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.05em;
    }

    /* ── Footer ── */
    footer {

      padding: 24px;
      font-size: 0.68rem;
      color: rgba(240,232,208,0.2);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.15em;
    }
  </style>
</head>
