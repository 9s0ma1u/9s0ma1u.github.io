<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9s0ma1u のアプリ一覧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d14;
      color: #fff;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
    }

    /* ── 背景グロー ── */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(139,26,47,0.35) 0%, transparent 70%);
      animation: drift1 8s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: 10%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(30,60,120,0.3) 0%, transparent 70%);
      animation: drift2 10s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(8%, 10%) scale(1.1); }
    }
    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-8%, -6%) scale(1.15); }
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .hero-img-wrap {
      position: relative;
      width: 100%;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-img-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(to bottom, transparent, #0d0d14);
    }

    /* ── ヘッダーテキスト ── */
    .header-text {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px 20px 40px;
    }

    .header-text .label {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 10px;
    }

    .header-text h1 {
      font-size: clamp(1.7rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #fff 0%, #c9a84c 50%, #e8c97a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    /* ── Main content ── */
    .main {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px 64px;
    }

    /* ── App card ── */
    .app-card {
      display: block;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card:active { transform: scale(0.97); }

    /* カード上部: アイコン + 情報 */
    .app-card-top {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 22px 22px 16px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(139,26,47,0.5);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-meta { flex: 1; min-width: 0; }

    .app-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .app-sub {
      font-size: 0.72rem;
      color: #c9a84c;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .app-badge {
      display: inline-block;
      font-size: 0.62rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(139,26,47,0.4);
      border: 1px solid rgba(201,168,76,0.3);
      color: #e8c97a;
      letter-spacing: 0.06em;
    }

    /* カード下部: 説明 */
    .app-desc {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.75;
      padding: 0 22px 18px;
    }

    /* ダウンロードボタン */
    .app-dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 14px 16px;
      padding: 16px;
      background: linear-gradient(135deg, #c0392b, #8b1a2f);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 20px rgba(139,26,47,0.5);
    }

    .app-dl-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ── Instagram ── */
    .insta-section { text-align: center; }

    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50px;
      text-decoration: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .insta-link:active {
      background: rgba(255,255,255,0.1);
    }

    .insta-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .insta-note {
      margin-top: 10px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.06em;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 16px 24px 36px;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.15em;
    }

    /* ── フェードイン ── */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.25s; }
    .fade-in:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
