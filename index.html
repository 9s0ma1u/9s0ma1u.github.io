<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9s0ma1u のアプリ一覧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0f;
      color: #f0e8d0;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    }

    /* ── Hero: 画像を正しい比率で表示 ── */
    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 下端にフェードアウト */
    .hero-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(to bottom, transparent, #0a0a0f);
    }

    /* ── ページタイトル（画像の下） ── */
    .page-header {
      text-align: center;
      padding: 28px 24px 36px;
    }

    .page-header h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #f0e8d0;
    }

    .gold-line {
      width: 56px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 14px auto 0;
    }

    /* ── Section ── */
    .section {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.38em;
      color: #c9a84c;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── App card ── */
    .app-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(145deg, #1c1028, #0d1b30);
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.25s, border-color 0.25s;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card:active {
      transform: scale(0.98);
    }

    .app-card-inner {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 18px 18px 14px;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 17px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .app-sub {
      font-size: 0.72rem;
      color: #c9a84c;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    .app-desc {
      font-size: 0.78rem;
      color: rgba(240,232,208,0.55);
      line-height: 1.7;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    }

    /* ダウンロードボタン */
    .app-dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 14px 16px;
      padding: 15px 16px;
      background: linear-gradient(135deg, #8b1a2f, #6b2040);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 12px;
      color: #f0e8d0;
      font-size: 0.92rem;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.09em;
      font-weight: 600;
    }

    .app-dl-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18), transparent);
      margin: 36px 0;
    }

    /* ── Instagram ── */
    .insta-section {
      text-align: center;
    }

    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      border: 1px solid rgba(201,168,76,0.32);
      border-radius: 50px;
      text-decoration: none;
      color: #f0e8d0;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.2s;
    }

    .insta-link:active {
      background: rgba(201,168,76,0.06);
    }

    .insta-link svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .insta-note {
      margin-top: 10px;
      font-size: 0.7rem;
      color: rgba(240,232,208,0.32);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.06em;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px 24px 40px;
      font-size: 0.65rem;
      color: rgba(240,232,208,0.18);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>

  <div class="page-header">

  </div>

  <footer>© 2026 9s0ma1u</footer>

</body>
</html>
