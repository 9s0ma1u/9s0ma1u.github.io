<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9s0ma1u のアプリ一覧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0f;
      color: #f0e8d0;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
      min-height: 100vh;
    }

    /* Hero */
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,15,0.1) 0%,
        rgba(10,10,15,0.0) 40%,
        rgba(10,10,15,0.7) 75%,
        rgba(10,10,15,1.0) 100%
      );
    }

    .hero-title {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-bottom: 48px;
    }

    .hero-title h1 {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f0e8d0;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    .gold-line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 16px auto 0;
    }

    /* Apps section */
    .section {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #c9a84c;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-align: center;
    }

    /* App card */
    .app-card {
      background: linear-gradient(135deg, #1a0f18 0%, #0f1a2e 100%);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, border-color 0.2s;
    }

    .app-card:hover {
      transform: translateY(-3px);
      border-color: rgba(201,168,76,0.7);
    }

    .app-card-inner {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 24px;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(201,168,76,0.2);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-info { flex: 1; }

    .app-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f0e8d0;
      margin-bottom: 6px;
    }

    .app-sub {
      font-size: 0.8rem;
      color: #c9a84c;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .app-desc {
      font-size: 0.85rem;
      color: rgba(240,232,208,0.65);
      line-height: 1.6;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    }

    .app-store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 24px 24px;
      padding: 14px;
      background: linear-gradient(135deg, #8b1a2f, #6b2040);
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 10px;
      color: #f0e8d0;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      transition: opacity 0.2s;
    }

    .app-card:hover .app-store-btn { opacity: 0.85; }

    .app-store-btn svg { flex-shrink: 0; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
      margin: 8px 0 40px;
    }

    /* Instagram */
    .insta-section {
      text-align: center;
    }

    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 50px;
      text-decoration: none;
      color: #f0e8d0;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      transition: border-color 0.2s, background 0.2s;
    }

    .insta-link:hover {
      border-color: rgba(201,168,76,0.7);
      background: rgba(201,168,76,0.05);
    }

    .insta-icon {
      width: 22px;
      height: 22px;
    }

    .insta-note {
      margin-top: 12px;
      font-size: 0.75rem;
      color: rgba(240,232,208,0.4);
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      letter-spacing: 0.05em;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px 24px 48px;
      font-size: 0.7rem;
      color: rgba(240,232,208,0.25);
      letter-spacing: 0.15em;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    }
  </style>
</head>
